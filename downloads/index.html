<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="editor-theme" content="pixel">
<meta name="editor-accent" content="#ed781e">
<title>ItsHoneycomb&#39;s downloads</title>
<style>

*{box-sizing:border-box}
body{
 margin:0;
 background:#17152b;
 color:#fff4c7;
 font-family:"Courier New",monospace;
 font-weight:bold;
 min-height:100vh;
 background-image:radial-gradient(#51406f 1px,transparent 1px);
 background-size:8px 8px
}
body:before{
 content:"★ ✦ ☆ ✧ ★ ✦ ☆ ✧ ★ ✦ ☆ ✧ ★ ✦ ☆";
 display:block;
 text-align:center;
 padding:12px 5px;
 color:#ffcc66;
 background:#211b3d;
 border-bottom:3px ridge #a99ad8;
 word-spacing:12px
}
header{
 padding:34px 20px 27px;
 text-align:center;
 background:linear-gradient(90deg,#ff6b6b,#ffbd59,#65d6ce,#8b7bff);
 border-bottom:5px ridge #fff4c7;
 box-shadow:0 5px 0 #090817
}
h1{
 margin:0;
 font-size:clamp(25px,5vw,42px);
 color:#211735;
 text-shadow:3px 3px 0 #fff4c7;
 letter-spacing:1px
}
header p{
 margin:12px 0 0;
 color:#211735;
 text-shadow:1px 1px #fff4c7
}
main{max-width:900px;margin:30px auto;padding:0 18px}
.download{
 display:flex;
 align-items:center;
 gap:17px;
 padding:17px;
 margin:15px 0;
 background:#292443;
 border:3px ridge #a99ad8;
 border-radius:0;
 box-shadow:5px 5px 0 #090817
}
.emoji{font-size:32px}
.details{flex:1;min-width:0}
.name{
 font-size:18px;
 color:#ffe28a;
 text-shadow:2px 2px #17152b
}
.details p{margin:7px 0;color:#e1d9ff;line-height:1.5}
.details small{color:#aeece4}
.badge{
 display:inline-block;
 font-size:10px;
 padding:4px 7px;
 border:2px outset #fff4c7;
 background:#ff6b6b;
 color:#211735
}
.download-button{
 white-space:nowrap;
 text-decoration:none;
 color:#211735;
 font-weight:bold;
 padding:10px 14px;
 border:3px outset #ffe28a;
 border-radius:0;
 background:#ffbd59;
 box-shadow:3px 3px 0 #090817
}
.download-button:hover{background:#65d6ce;transform:translate(-1px,-1px)}
a{color:#65d6ce}
footer{
 text-align:center;
 color:#ffcc66;
 padding:25px;
 border-top:3px dashed #a99ad8;
 margin-top:35px
}
@media(max-width:570px){
 .download{flex-wrap:wrap}
 .download-button{margin-left:49px}
 .details{min-width:calc(100% - 60px)}
}

</style>
</head>
<body>
<header>
<h1>Downloads</h1>
<p>Useful tools, projects and experiments.</p>
</header>
<main>

 <article class="download">
  <div class="emoji">🀆</div>
  <div class="details">
   <div class="name">iPad Simulator <span class="badge">Scratch!</span></div>
   <p>iPad Simulator made in Scratch</p>
   <small>sb3 · Version 1.0</small>
  </div>
  <a class="download-button" href="iPad Simulator.sb3" download>Download ↓</a>
 </article>
</main>
<footer>★ Made with ItsHoneycomb's Downloads Studio ★</footer>
</body>
</html>
