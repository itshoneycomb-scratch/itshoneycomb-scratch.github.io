<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="editor-theme" content="orange">
<meta name="editor-accent" content="#ed781e">
<title>ItsHoneycomb&#39;s downloads</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#25292e,#41464c,#25292e);font-family:Arial,sans-serif;color:#292d31;min-height:100vh}
header{padding:38px 20px 30px;text-align:center;background:linear-gradient(135deg,#f2a15e,#d96d20,#a84912);border-bottom:1px solid #ffffff55;box-shadow:0 4px 15px #0005}
h1{margin:0;font-size:clamp(27px,5vw,43px);text-shadow:0 1px #fff8;color:#282a2c}
header p{margin:10px 0 0;color:#332a23}
main{max-width:900px;margin:35px auto;padding:0 18px}
.download{display:flex;align-items:center;gap:17px;padding:18px;margin:13px 0;background:linear-gradient(120deg,#f4f5f6,#c8cdd1,#edf0f2);border:1px solid #fff;border-radius:12px;box-shadow:0 4px 12px #0005}
.emoji{font-size:32px}
.details{flex:1;min-width:0}
.name{font-size:18px;font-weight:bold}
.details p{margin:7px 0;color:#50565c}
.details small{color:#737980}
.badge{font-size:10px;padding:4px 7px;border-radius:5px;background:#ed781e;color:white}
.download-button{white-space:nowrap;text-decoration:none;color:white;font-weight:bold;padding:11px 17px;border-radius:7px;background:linear-gradient(#ffb36e,#ed781e,#a94b0d);border:1px solid #a94b0d;box-shadow:inset 0 1px #fff8,0 2px 4px #0004}
@media(max-width:570px){.download{flex-wrap:wrap}.download-button{margin-left:49px}.details{min-width:calc(100% - 60px)}}
</style>
</head>
<body>
<header><h1>Downloads</h1><p>Useful tools, projects and experiments.</p></header>
<main>
 <article class="download">
  <div class="emoji">🀆</div>
  <div class="details">
   <div class="name">iPad Simulator <span class="badge">Scratch!</span></div>
   <p>iPad Simulator made in Scratch</p>
   <small>sb3 · Version 1.0</small>
  </div>
  <a class="download-button" href="iPad Simulator.sb3" download>Download ↓</a>
 </article></main>
</body>
</html>
