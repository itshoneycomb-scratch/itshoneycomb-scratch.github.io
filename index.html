<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#91c9ed">
  <title>ItsHoneycomb</title>

 <style>
  * { box-sizing: border-box; }

body {
  min-height: 100vh;
  margin: 0;
  padding: 36px 18px;
  display: grid;
  place-items: center;
  color: #19364e;
  font-family: "Segoe UI", Arial, sans-serif;
  background: #fff;
}


  .card {
    width: min(440px, 100%);
    padding: 30px 24px 22px;
    text-align: center;
    background: rgba(255,255,255,.56);
    border: 1px solid rgba(255,255,255,.88);
    border-radius: 0;
    box-shadow: 0 24px 70px rgba(33,75,112,.24),
                inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
  }

  .avatar {
    width: 100px;
    height: 100px;
    margin: 0 auto 15px;
    display: grid;
    place-items: center;
    border: 3px solid white;
    border-radius: 0;
    background: linear-gradient(145deg, #fff, #b9e9fa);
    box-shadow: 0 9px 24px rgba(38,100,136,.2);
    font-size: 45px;
  }

  h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: -.5px;
  }

  .bio {
    max-width: 330px;
    margin: 9px auto 22px;
    color: #526d81;
    font-size: 15px;
    line-height: 1.55;
  }

  .links {
    display: grid;
    gap: 12px;
  }

  .link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 56px;
    padding: 13px 18px;
    color: #214962;
    font-weight: 650;
    text-decoration: none;
    background: #e5e5e5;

    border: 1px solid white;
    border-radius: 0;
    box-shadow: 0 5px 13px rgba(37,91,123,.12),
                inset 0 1px 0 white;
  }

  .link:hover,
  .social:hover {
    transform: none;
  }

  .link:focus-visible,
  .social:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 3px;
  }

  .icon { font-size: 20px; }

  .socials {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 21px;
  }

  .social {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    color: #285673;
    font-size: 18px;
    text-decoration: none;
    background: rgba(255,255,255,.7);
    border: 1px solid white;
    border-radius: 0;
    box-shadow: 0 4px 11px rgba(37,91,123,.12);
  }

  .footer {
    margin: 21px 0 0;
    color: #688094;
    font-size: 12px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
    }
  }

</style>

</head>

<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">💻</div>

    <h1>ItsHoneycomb</h1>
    <p class="bio">
    i am a linux user, gamer and a scratcher
    </p>

    <nav class="links" aria-label="My links">
      <a class="link" href="https://itshoneycomb-scratch.github.io">
        <span class="icon" aria-hidden="true">🌐</span>
        My website
      </a>

      <a class="link" href="https://itshoneycomb-scratch.github.io/downloads/">
        <span class="icon" aria-hidden="true">⬇️</span>
        Downloads
      </a>

      <a class="link" href="https://youtube.com/@itshoneycomb-scratch">
        <span class="icon" aria-hidden="true">▶️</span>
        YouTube
      </a>

      <a class="link" href="https://github.com/itshoneycomb-scratch/">
        <span class="icon" aria-hidden="true">💻</span>
        My projects
      </a>

      <a class="link" href="mailto:itshoneycomb@proton.me">
        <span class="icon" aria-hidden="true">✉️</span>
        Email me
      </a>
    </nav>

    <div class="socials" aria-label="Social profiles">
      <a class="social" href="https://youtube.com/@itshoneycomb-scratch" aria-label="YouTube">▶</a>
      <a class="social" href="https://github.com/itshoneycomb-scratch" aria-label="GitHub">⌘</a>
    </div>
  </main>
</body>
</html>
